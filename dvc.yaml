stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    params:
    - data_ingestion.data_path
    outs:
    - dataset/data_ingestion

  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
    - dataset/data_ingestion
    - src/data_preprocessing.py
    outs:
    - dataset/data_preprocessing

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
    - dataset/data_preprocessing
    - src/feature_engineering.py
    outs:
    - dataset/feature_engineering

  model_training:
    cmd: python src/model_training.py
    deps:
    - dataset/feature_engineering
    - src/model_training.py
    params:
    - model_training.test_size
    - model_training.random_state
    - model_training.lr
    outs:
    - model/model.pkl

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
    - model/model.pkl
    - src/model_evaluation.py
    params:
    - model_evaluation.test_size
    - model_evaluation.random_state
    outs:
    - model_reports/metrics.json

metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
params:
- dvclive/params.yaml
